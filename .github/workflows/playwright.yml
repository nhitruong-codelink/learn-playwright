name: Playwright Tests

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout Toolshop app
      uses: actions/checkout@v4
      with:
        repository: testsmith-io/practice-software-testing
        path: toolshop-app

    - name: Start Toolshop app (UI, API, DB)
      working-directory: toolshop-app
      run: docker compose -f docker-compose.yml up -d --build

    - name: Wait for API to be ready
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8091/products > /dev/null; then
            echo "API is up"
            break
          fi
          echo "Waiting for API..."
          sleep 5
        done

    - name: Wait for Composer install to finish
      working-directory: toolshop-app
      run: |
        for i in $(seq 1 60); do
          if docker compose exec -T laravel-api test -f /var/www/vendor/autoload.php; then
            echo "Composer dependencies are installed"
            break
          fi
          echo "Waiting for composer install..."
          sleep 5
        done

    - name: Seed database
      working-directory: toolshop-app
      run: docker compose exec -T laravel-api php artisan migrate:fresh --seed --force

    - name: Wait for UI to be ready
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:4200 > /dev/null; then
            echo "UI is up"
            break
          fi
          echo "Waiting for UI..."
          sleep 5
        done

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test --project=chromium

    - name: Upload blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report
        path: blob-report
        retention-days: 7

    - name: Upload allure results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results
        retention-days: 7

    - name: Stop Toolshop app
      if: always()
      working-directory: toolshop-app
      run: docker compose down -v

  merge-report:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: blob-report
          pattern: blob-report

      - run: npx playwright merge-reports --reporter html ./blob-report/blob-report

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14

      - uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results

      - name: Generate Allure report
        run: npx allure-commandline generate ./allure-results/allure-results --clean -o ./allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
