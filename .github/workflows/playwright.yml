name: Playwright Tests
on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout Toolshop app
      uses: actions/checkout@v4
      with:
        repository: testsmith-io/practice-software-testing
        path: toolshop-app

    - name: Start Toolshop app (UI, API, DB)
      working-directory: toolshop-app
      run: docker compose -f docker-compose.yml up -d --build

    - name: Wait for API to be ready
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8091/products > /dev/null; then
            echo "API is up"
            break
          fi
          echo "Waiting for API..."
          sleep 5
        done

    - name: Wait for Composer install to finish
      working-directory: toolshop-app
      run: |
        for i in $(seq 1 60); do
          if docker compose exec -T laravel-api test -f /var/www/vendor/autoload.php; then
            echo "Composer dependencies are installed"
            break
          fi
          echo "Waiting for composer install..."
          sleep 5
        done

    - name: Seed database
      working-directory: toolshop-app
      run: docker compose exec -T laravel-api php artisan migrate:fresh --seed --force

    - name: Wait for UI to be ready
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:4200 > /dev/null; then
            echo "UI is up"
            break
          fi
          echo "Waiting for UI..."
          sleep 5
        done

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30

    - name: Stop Toolshop app
      if: always()
      working-directory: toolshop-app
      run: docker compose down -v
