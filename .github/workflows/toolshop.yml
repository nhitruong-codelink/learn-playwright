name: Toolshop Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Tag scope"
        type: choice
        default: regression
        options: [regression, smoke]
      browser:
        description: "Browser project"
        type: choice
        default: chromium
        options: [all, chromium, firefox, webkit]
      test_name:
        description: "Only tests whose title matches (regex; overrides scope)"
        type: string
        default: ""
      spec:
        description: "Only this spec file, e.g. tests/checkout/checkout-order.spec.ts"
        type: string
        default: ""
      shards:
        description: "Shard count (use 1 for narrow filters)"
        type: choice
        default: "2"
        options: ["2", "1"]
      retries:
        description: "Rerun each failing test N times (--retries)"
        type: string
        default: ""
      repeat_each:
        description: "Run each selected test N times (--repeat-each; flake hunting)"
        type: string
        default: ""
      workers:
        description: "Override worker count (1 = serialize)"
        type: string
        default: ""
      trace:
        description: "Full traces for every test"
        type: boolean
        default: false

env:
  UI_BASE_URL: ${{ vars.UI_BASE_URL || 'http://localhost:4200' }}
  API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8091' }}

jobs:
  test:
    name: "test (${{ github.event.inputs.scope || 'regression' }} / ${{ github.event.inputs.browser || 'chromium' }} / shard ${{ matrix.shard }})"
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1 shard when the dispatch picks it OR narrows to a test_name/spec (a 2-shard
        # split of a narrow filter can leave one shard with 0 tests); push/PR keep 2.
        shard: ${{ fromJSON((  (github.event.inputs.shards || '2') == '1' || github.event.inputs.test_name != '' || github.event.inputs.spec != ''  ) && '[1]' || '[1,2]') }}
    steps:
    - uses: actions/checkout@v4

    - name: Checkout Toolshop app
      uses: actions/checkout@v4
      with:
        repository: testsmith-io/practice-software-testing
        path: toolshop-app

    - name: Remove obsolete compose version attribute
      working-directory: toolshop-app
      run: sed -i '/^version:/d' docker-compose.yml docker-compose.override.yml

    - name: Start Toolshop app (UI, API, DB)
      working-directory: toolshop-app
      run: docker compose up -d --build laravel-api angular-ui web mariadb mailcatcher composer phpmyadmin

    - name: Wait for API to be ready
      run: |
        for i in $(seq 1 60); do
          if curl -sf ${{ env.API_BASE_URL }}/products > /dev/null; then
            echo "API is up"
            break
          fi
          echo "Waiting for API..."
          sleep 5
        done

    - name: Wait for Composer install to finish
      working-directory: toolshop-app
      run: |
        ok=false
        for i in $(seq 1 60); do
          if docker compose exec -T laravel-api test -f /var/www/vendor/autoload.php; then
            echo "Composer dependencies are installed"
            ok=true
            break
          fi
          echo "Waiting for composer install..."
          sleep 5
        done
        if [ "$ok" != "true" ]; then
          echo "::error::vendor/autoload.php not found after waiting. Dumping composer and laravel-api logs:"
          docker compose logs composer --tail=200 || true
          docker compose logs laravel-api --tail=200 || true
          exit 1
        fi

    - name: Fix storage/bootstrap-cache permissions
      working-directory: toolshop-app
      run: |
        # The upstream "composer" service runs `chown -R www-data /var/www && chmod 777 /var/www`
        # (no -R on chmod) inside the *composer* image, where www-data has a different UID than
        # in laravel-api (which remaps www-data to UID 1000). This leaves storage/bootstrap/cache
        # owned by the wrong UID with non-writable permissions for the laravel-api process.
        docker compose exec -T -u root laravel-api sh -c \
          'chown -R www-data:www-data storage bootstrap/cache && chmod -R 775 storage bootstrap/cache'
        if ! docker compose exec -T laravel-api sh -c 'test -w storage/logs && test -w bootstrap/cache'; then
          echo "::error::storage/bootstrap-cache still not writable by www-data after chown/chmod fix"
          docker compose exec -T laravel-api sh -c 'id; ls -la storage storage/logs bootstrap/cache' || true
          exit 1
        fi

    - name: Wait for MariaDB to be ready
      working-directory: toolshop-app
      run: |
        ok=false
        for i in $(seq 1 60); do
          if docker compose exec -T mariadb mysqladmin ping -uroot -proot --silent > /dev/null 2>&1; then
            echo "MariaDB is up"
            ok=true
            break
          fi
          echo "Waiting for MariaDB..."
          sleep 5
        done
        if [ "$ok" != "true" ]; then
          echo "::error::MariaDB did not become ready in time. Dumping mariadb logs:"
          docker compose logs mariadb --tail=200 || true
          exit 1
        fi

    - name: Seed database
      working-directory: toolshop-app
      run: |
        ok=false
        for i in $(seq 1 10); do
          if docker compose exec -T laravel-api php artisan migrate:refresh --seed; then
            echo "Database migrated and seeded"
            ok=true
            break
          fi
          echo "Seed attempt $i failed, retrying..."
          sleep 5
        done
        if [ "$ok" != "true" ]; then
          echo "::error::migrate:refresh --seed failed after retries. Dumping laravel-api logs:"
          docker compose logs laravel-api --tail=200 || true
          exit 1
        fi

    - name: Verify seed data is correct
      working-directory: toolshop-app
      run: |
        ok=false
        for i in $(seq 1 30); do
          products_count=$(curl -sf ${{ env.API_BASE_URL }}/products 2>/dev/null | grep -o '"id"' | wc -l || true)
          products_count=${products_count:-0}
          categories=$(curl -sf ${{ env.API_BASE_URL }}/categories 2>/dev/null || true)
          has_power_tools=$(echo "$categories" | grep -c "Power Tools" || true)
          has_power_tools=${has_power_tools:-0}
          if [ "$products_count" -gt 0 ] && [ "$has_power_tools" -gt 0 ]; then
            echo "Seed data looks correct ($products_count products, Power Tools category found)"
            ok=true
            break
          fi
          echo "Waiting for seed data (products=$products_count, power_tools_found=$has_power_tools)..."
          sleep 5
        done
        if [ "$ok" != "true" ]; then
          echo "::error::Seed data is missing or incomplete after waiting. Dumping laravel-api logs:"
          docker compose logs laravel-api --tail=200
          echo "::error::Raw /products response body:"
          curl -sv ${{ env.API_BASE_URL }}/products 2>&1 || true
          echo "::error::Dumping Laravel application log (storage/logs/laravel.log):"
          docker compose exec -T laravel-api sh -c 'tail -n 200 storage/logs/laravel.log' || true
          echo "::error::Filesystem permissions inside laravel-api:"
          docker compose exec -T laravel-api sh -c 'id; ls -la storage storage/logs bootstrap/cache' || true
          exit 1
        fi

    - name: Wait for UI to be ready
      run: |
        for i in $(seq 1 60); do
          if curl -sf ${{ env.UI_BASE_URL }} > /dev/null; then
            echo "UI is up"
            break
          fi
          echo "Waiting for UI..."
          sleep 5
        done

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium firefox webkit

    - name: Run Playwright tests
      env:
        # Dispatch inputs → CLI args. Empty on push/PR (handled by the else branch).
        SCOPE: ${{ github.event.inputs.scope }}
        BROWSER: ${{ github.event.inputs.browser }}
        TEST_NAME: ${{ github.event.inputs.test_name }}
        SPEC: ${{ github.event.inputs.spec }}
        RETRIES: ${{ github.event.inputs.retries }}
        REPEAT_EACH: ${{ github.event.inputs.repeat_each }}
        WORKERS: ${{ github.event.inputs.workers }}
        TRACE: ${{ github.event.inputs.trace }}
        # Must match the matrix length above, incl. the narrow-filter → 1 shard rule.
        SHARD_TOTAL: ${{ (  (github.event.inputs.shards || '2') == '1' || github.event.inputs.test_name != '' || github.event.inputs.spec != ''  ) && '1' || '2' }}
      run: |
        ARGS=()

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ -n "$TEST_NAME" ]; then
            ARGS+=(--grep "$TEST_NAME")
          else
            ARGS+=(--grep "@${SCOPE:-regression}")
          fi

          if [ -n "$BROWSER" ] && [ "$BROWSER" != "all" ]; then
            ARGS+=(--project="$BROWSER")
          fi

          if [ -n "$RETRIES" ]; then ARGS+=(--retries="$RETRIES"); fi
          if [ -n "$REPEAT_EACH" ]; then ARGS+=(--repeat-each="$REPEAT_EACH"); fi
          if [ -n "$WORKERS" ]; then ARGS+=(--workers="$WORKERS"); fi
          if [ "$TRACE" = "true" ]; then ARGS+=(--trace=on); fi

          if [ -n "$SPEC" ]; then ARGS+=("$SPEC"); fi
        else
          ARGS+=(--project=chromium --grep @regression)
        fi

        npx playwright test "${ARGS[@]}" --shard="${{ matrix.shard }}/${SHARD_TOTAL}"

    - name: Upload blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shard }}
        path: blob-report
        retention-days: 7

    - name: Upload allure results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ matrix.shard }}
        path: allure-results
        retention-days: 7

    - name: Stop Toolshop app
      if: always()
      working-directory: toolshop-app
      run: docker compose down -v

  merge-report:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14

      - uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Generate Allure report
        run: npx allure-commandline generate ./allure-results --clean -o ./allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
